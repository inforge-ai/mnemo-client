[project]
name = "mnemo-client"
version = "0.1.0"
description = "Lightweight async Python client for the Mnemo API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["mnemo_client.py"]
